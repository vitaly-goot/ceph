# GitHub Action to build ceph debians & docker images with build-with-container.py
name: Build Ceph Deliverables

on:
  workflow_dispatch:
    inputs:
      include_debug_packages:
        description: Build and keep Debian debug packages (-dbg/-dbgsym)
        required: false
        default: 'true'
        type: boolean
      upload_teuthology_artifacts:
        description: Upload Teuthology artifacts as workflow artifacts
        required: false
        default: 'false'
        type: boolean
  push:
    branches:
      - 'aka_version_*'
    tags:
      - 'v*'
  pull_request:
    branches:
      - 'aka_version_*'
    types:
      - opened
      - synchronize
      - reopened
      - labeled

concurrency:
  group: build-ceph-deliverables-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

env:
  build_arch: "x86-64-v3"
  # LTO builds OOM kill if we use more than 
  percentage_of_cpus_to_use: "25"
  enable_ccache: "false"
  enable_sccache: "true"
  # Policy:
  # - pull_request: keep debug packages enabled
  # - release tags (v*): disable debug packages by default
  # - aka_version_* branches: disable debug packages by default
  # - workflow_dispatch: allow explicit operator override via input
  include_debug_packages: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.include_debug_packages || (github.event_name == 'pull_request' && 'true') || (startsWith(github.ref, 'refs/tags/v') && 'false') || (startsWith(github.ref, 'refs/heads/aka_version_') && 'false') || 'true' }}
  upload_teuthology_artifacts: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.upload_teuthology_artifacts || 'false' }}

jobs:

  resolve-lifecycle:
    if: ${{ github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'build-debian') || contains(github.event.pull_request.labels.*.name, 'build-rpm') || contains(github.event.pull_request.labels.*.name, 'build-ubuntu') }}
    runs-on: ceph
    outputs:
      lifecycle_environment: ${{ steps.resolve.outputs.lifecycle_environment }}
      publish_allowed: ${{ steps.resolve.outputs.publish_allowed }}
      docker_tag: ${{ steps.resolve.outputs.docker_tag }}
    steps:
      - name: Resolve lifecycle environment and publish policy
        id: resolve
        shell: bash
        run: |
          set -euo pipefail

          ref_type="${GITHUB_REF_TYPE}"
          ref_name="${GITHUB_REF_NAME}"

          if [[ "${GITHUB_EVENT_NAME}" == "pull_request" ]]; then
            ref_type="branch"
            ref_name="${GITHUB_HEAD_REF}"
          fi

          # Determine lifecycle environment from ref pattern
          if [[ "${ref_type}" == "tag" ]]; then
            lifecycle_environment="qa"
            docker_tag="${ref_name}"
          elif [[ "${ref_name}" == aka_version_* ]]; then
            lifecycle_environment="testing"
          else
            lifecycle_environment="development"
          fi

          short_sha="${GITHUB_SHA::8}"
          safe_ref_name="$(echo "${ref_name}" | tr '[:upper:]' '[:lower:]' | sed -E 's#[^a-z0-9._-]+#-#g; s#^-+##; s#-+$##; s#--+#-#g')"
          if [[ "${ref_type}" != "tag" ]]; then
            docker_tag="${safe_ref_name}-${short_sha}"
          fi

          publish_allowed="true"
          if [[ "${GITHUB_EVENT_NAME}" == "pull_request" ]]; then
            publish_allowed="false"
            lifecycle_environment="development"

            # PRs are non-publishing by default. Operators must add an
            # explicit opt-in label to exercise Artifactory publication from a
            # PR run. Those test publishes always target the development
            # lifecycle so they cannot be confused with promotable release
            # artifacts.
            if [[ "${{ contains(github.event.pull_request.labels.*.name, 'publish-artifacts') }}" == "true" ]]; then
              publish_allowed="true"
            fi
          fi

          echo "lifecycle_environment=${lifecycle_environment}" >> "${GITHUB_OUTPUT}"
          echo "publish_allowed=${publish_allowed}" >> "${GITHUB_OUTPUT}"
          echo "docker_tag=${docker_tag}" >> "${GITHUB_OUTPUT}"

  preflight-registry:
    needs: resolve-lifecycle
    environment: ${{ needs.resolve-lifecycle.outputs.lifecycle_environment }}
    runs-on: ceph
    steps:
      - name: Verify Docker and Buildx are available
        run: |
          set -euo pipefail
          docker version
          docker buildx version

      - name: Prepare Artifactory CA trust
        if: ${{ needs.resolve-lifecycle.outputs.publish_allowed == 'true' }}
        id: prepare-ca
        uses: StorageTeam/build-ceph-action/composite-actions/prepare-artifactory-ca@v0.13.1
        with:
          artifactory_url: https://${{ vars.DOCKER_URL }}
          artifactory_ca_url: ${{ vars.ARTIFACTORY_CA_URL || 'https://us-east-1.linodeobjects.com/linode-internal-ca/cacert-2019.pem' }}
          artifactory_ca_pem: ${{ secrets.ARTIFACTORY_CA_PEM }}
          install_docker_certs: 'true'
          require_ca: 'true'

      - name: Verify registry CA trust and TLS handshake
        if: ${{ needs.resolve-lifecycle.outputs.publish_allowed == 'true' }}
        env:
          DOCKER_URL: ${{ vars.DOCKER_URL }}
        run: |
          set -euo pipefail

          # Extract registry host from DOCKER_URL
          registry="${DOCKER_URL#https://}"
          registry="${registry#http://}"
          registry="${registry%%/*}"
          ca_file="${{ steps.prepare-ca.outputs.ca_file }}"

          if ! echo | openssl s_client -verify_return_error -servername "${registry}" -connect "${registry}:443" -CAfile "${ca_file}" >/tmp/registry_tls_check.log 2>&1; then
            echo "TLS handshake failed using CA file: ${ca_file}"
            cat /tmp/registry_tls_check.log
            exit 1
          fi

          if ! grep -q "Verify return code: 0 (ok)" /tmp/registry_tls_check.log; then
            echo "Registry cert verification did not return OK"
            cat /tmp/registry_tls_check.log
            exit 1
          fi

          echo "Registry TLS trust check passed"

      - name: Verify registry authentication
        if: ${{ needs.resolve-lifecycle.outputs.publish_allowed == 'true' }}
        env:
          DOCKER_URL: ${{ vars.DOCKER_URL }}
          REGISTRY_USERNAME: ${{ vars.RT_USERNAME }}
          REGISTRY_PASSWORD: ${{ secrets.RT_PASSWORD }}
          SSL_CERT_FILE: ${{ steps.prepare-ca.outputs.ca_file }}
        run: |
          set -euo pipefail

          # Extract registry host from DOCKER_URL
          registry="${DOCKER_URL#https://}"
          registry="${registry#http://}"
          registry="${registry%%/*}"

          if [[ -z "${REGISTRY_USERNAME}" || -z "${REGISTRY_PASSWORD}" ]]; then
            echo "::error::Registry credentials are missing (RT_USERNAME or RT_PASSWORD)"
            exit 1
          fi

          # Verify credentials via Docker Registry API v2 (curl respects SSL_CERT_FILE)
          echo "Verifying registry credentials via API..."
          http_code=$(curl -fsSL -o /dev/null -w "%{http_code}" \
            --cacert "${SSL_CERT_FILE}" \
            -u "${REGISTRY_USERNAME}:${REGISTRY_PASSWORD}" \
            "https://${registry}/v2/" 2>/dev/null) || true

          if [[ "${http_code}" == "200" || "${http_code}" == "401" ]]; then
            # 401 with valid TLS means we reached the registry - auth will be checked on push
            # 200 means auth worked (some registries return 200 for valid creds)
            echo "Registry reachable at https://${registry}/v2/ (HTTP ${http_code})"
          else
            echo "::error::Failed to reach registry at https://${registry}/v2/ (HTTP ${http_code})"
            exit 1
          fi

          # Try authenticated request to verify credentials
          http_code=$(curl -fsSL -o /dev/null -w "%{http_code}" \
            --cacert "${SSL_CERT_FILE}" \
            -u "${REGISTRY_USERNAME}:${REGISTRY_PASSWORD}" \
            "https://${registry}/v2/_catalog" 2>/dev/null) || true

          if [[ "${http_code}" == "200" ]]; then
            echo "Registry authentication verified successfully"
          elif [[ "${http_code}" == "401" || "${http_code}" == "403" ]]; then
            echo "::error::Registry authentication failed (HTTP ${http_code}) - check RT_USERNAME and RT_PASSWORD"
            exit 1
          else
            # Some registries don't support _catalog, try alternate endpoint
            echo "Registry responded with HTTP ${http_code} - credentials will be verified on push"
          fi

  build-ceph-debians:
    needs:
      - resolve-lifecycle
      - preflight-registry
    outputs:
      ceph_package_repo_component: ${{ steps.derive-build-vars.outputs.ceph_codename }}
    environment: ${{ needs.resolve-lifecycle.outputs.lifecycle_environment }}
    strategy:
      matrix:
        include:
          - os_version: ubuntu22.04
            base_image: ubuntu:22.04
          #- os_version: debian13
          #  base_image: debian:trixie

    runs-on: ceph
    steps:
        - name: Checkout ceph
          uses: actions/checkout@v4
          with:
            path: ceph
            fetch-depth: 0
            lfs: true
            submodules: recursive

        - name: Derive build variables
          id: derive-build-vars
          uses: StorageTeam/build-ceph-action/composite-actions/derive-build-vars@v0.13.1
          with:
            ceph_path: ceph
            os_version: ${{ matrix.os_version }}
            percentage_of_cpus_to_use: ${{ env.percentage_of_cpus_to_use }}

        - name: Create build vars config file
          id: write-build-vars-config
          uses: StorageTeam/build-ceph-action/composite-actions/write-build-vars-config@v0.13.1
          with:
            ceph_path: ceph
            enable_ccache: ${{ env.enable_ccache }}
            enable_sccache: ${{ env.enable_sccache }}
            include_debug_packages: ${{ env.include_debug_packages }}
            redis_db_number: ${{ steps.derive-build-vars.outputs.redis_db_number }}
            ccache_namespace: ${{ steps.derive-build-vars.outputs.ccache_namespace }}
            cxx_standard: ${{ steps.derive-build-vars.outputs.cxx_standard }}
            number_of_cpus: ${{ steps.derive-build-vars.outputs.nprocesses }}
            output_path: ceph/src/script/custom/build-vars.config
            build_arch: ${{ env.build_arch }}

        - name: Run Build With Container on debians
          uses: StorageTeam/build-ceph-action/composite-actions/run-build-with-container@v0.13.1
          with:
            ceph_path: ceph
            os_version: ${{ matrix.os_version }}
            ceph_version: ${{ steps.derive-build-vars.outputs.ceph_build_version }}
            build_target: debs
            env_file: src/script/custom/build-vars.config
            custom_image_script: run-all.sh
            patch_rocksdb_portable: 'true'
            enable_ccache: ${{ env.enable_ccache }}

        - name: Cleanup Working dir in debs
          run: |
            # Delete workdir in ceph/<operating system>/debs/ to save space, as it is not needed for the upload artifact step
            workdir="$(find ceph/debs -mindepth 2 -maxdepth 2 -type d -name WORKDIR -print -quit)"

            rm -rf "$workdir"

            # Remove large source tarballs that are not required for artifact upload.
            tar_gz_count="$(find ceph/debs -type f -name '*.tar.gz' | wc -l | tr -d '[:space:]')"
            if [[ "${tar_gz_count}" -gt 0 ]]; then
              echo "Removing ${tar_gz_count} .tar.gz file(s) from ceph/debs"
              find ceph/debs -type f -name '*.tar.gz' -delete
            fi

            # Debug package artifacts are large and not needed for deliverable builds.
            dbg_deb_count="$(find ceph/debs -type f \( -name '*-dbg_*.deb' -o -name '*-dbgsym_*.deb' \) | wc -l | tr -d '[:space:]')"
            if [[ "${dbg_deb_count}" -gt 0 ]]; then
              echo "Removing ${dbg_deb_count} debug .deb file(s) from ceph/debs"
              find ceph/debs -type f \( -name '*-dbg_*.deb' -o -name '*-dbgsym_*.deb' \) -delete
            fi

        - name: Publish Debian repository to Artifactory
          if: ${{ needs.resolve-lifecycle.outputs.publish_allowed == 'true' }}
          uses: StorageTeam/build-ceph-action/composite-actions/publish-debian-repo@v0.13.1
          with:
            os_version: ${{ matrix.os_version }}
            source_path: ceph/debs
            base_rt_url: ${{ vars.BASE_RT_URL }}
            debian_repo: ${{ vars.DEBIAN_REPO }}
            rt_username: ${{ vars.RT_USERNAME }}
            rt_password: ${{ secrets.RT_PASSWORD }}
            component: ${{ steps.derive-build-vars.outputs.ceph_codename }}
            build_url: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
            scan_status: pending
            git_path: ceph

        - name: Upload debian packages
          uses: actions/upload-artifact@v3
          with:
            name: ceph-debians-${{ matrix.os_version }}
            path: ceph/debs

  build-ceph-docker-images:
    needs:
      - resolve-lifecycle
      - build-ceph-debians
    outputs:
      docker_image: ${{ steps.capture-docker-image.outputs.docker_image }}
      ceph_build_version: ${{ steps.derive-build-vars.outputs.ceph_build_version }}
      ceph_deb_version: ${{ steps.derive-build-vars.outputs.ceph_deb_version }}
    environment: ${{ needs.resolve-lifecycle.outputs.lifecycle_environment }}
    strategy:
      matrix:
        include:
          - os_version: ubuntu22.04
            base_image: ubuntu:22.04
    runs-on: ceph
    steps:
      - name: Checkout ceph
        uses: actions/checkout@v4
        with:
          path: ceph
          fetch-depth: 0
          lfs: true
          submodules: recursive

      - name: Derive build variables
        id: derive-build-vars
        uses: StorageTeam/build-ceph-action/composite-actions/derive-build-vars@v0.13.1
        with:
          ceph_path: ceph
          os_version: ${{ matrix.os_version }}

      - name: Resolve Docker image destinations
        id: resolve-docker
        shell: bash
        env:
          DOCKER_URL: ${{ vars.DOCKER_URL }}
        run: |
          set -euo pipefail

          if [[ -z "${DOCKER_URL}" ]]; then
            echo "::error::DOCKER_URL is not configured in environment"
            exit 1
          fi

          # Extract registry host from DOCKER_URL (e.g., storageeng-docker-testing.artifactory.linode.com)
          registry_host="${DOCKER_URL#https://}"
          registry_host="${registry_host#http://}"
          registry_host="${registry_host%%/*}"

          # Image repo is registry host + image name
          image_repo="${registry_host}/ceph-${{ matrix.os_version }}"

          echo "registry_host=${registry_host}" >> "${GITHUB_OUTPUT}"
          echo "image_repo=${image_repo}" >> "${GITHUB_OUTPUT}"

      - name: Prepare Docker registry CA trust
        if: ${{ needs.resolve-lifecycle.outputs.publish_allowed == 'true' }}
        uses: StorageTeam/build-ceph-action/composite-actions/prepare-artifactory-ca@v0.13.1
        with:
          artifactory_url: https://${{ steps.resolve-docker.outputs.registry_host }}
          artifactory_ca_url: ${{ vars.ARTIFACTORY_CA_URL || 'https://us-east-1.linodeobjects.com/linode-internal-ca/cacert-2019.pem' }}
          artifactory_ca_pem: ${{ secrets.ARTIFACTORY_CA_PEM }}
          install_docker_certs: 'true'
          require_ca: 'true'

      - name: Build and push docker image
        uses: StorageTeam/build-ceph-action/composite-actions/build-docker-images@v0.13.1
        with:
          artifact_name: ceph-debians-${{ matrix.os_version }}
          artifact_path: ceph
          docker_context: ceph
          dockerfile: ceph/.github/docker/Dockerfile.debian-packages
          image_tags: |
            ${{ steps.resolve-docker.outputs.registry_host }}/ceph-${{ steps.derive-build-vars.outputs.ceph_version }}:${{ matrix.os_version }}-${{ steps.derive-build-vars.outputs.ceph_build_version }}
          platforms: linux/amd64
          build_args: |
            BASE_IMAGE=${{ matrix.base_image }}
          buildx_driver: docker
          push: ${{ needs.resolve-lifecycle.outputs.publish_allowed == 'true' }}
          registry: ${{ steps.resolve-docker.outputs.registry_host }}
          registry_username: ${{ vars.RT_USERNAME }}
          registry_password: ${{ secrets.RT_PASSWORD }}

      - name: Capture Docker image output
        id: capture-docker-image
        run: |
          echo "docker_image=${{ steps.resolve-docker.outputs.registry_host }}/ceph-${{ steps.derive-build-vars.outputs.ceph_version }}:${{ matrix.os_version }}-${{ steps.derive-build-vars.outputs.ceph_build_version }}" >> "${GITHUB_OUTPUT}"
  
  # After building the debians & docker images, run teuthology suites to verify the build.
  # Only runs when artifacts were actually published, since the suite installs
  # the built .deb/image from Artifactory/the registry and would otherwise fail.
  call-teuthology-suites:
    needs:
      - resolve-lifecycle
      - build-ceph-debians
      - build-ceph-docker-images
    if: ${{ needs.resolve-lifecycle.outputs.publish_allowed == 'true' }}
    environment: ${{ needs.resolve-lifecycle.outputs.lifecycle_environment }}
    runs-on: teuthology
    timeout-minutes: 720
    strategy:
      fail-fast: false
      matrix:
        suite:
          - "rgw/singleton"
          - "rgw/verify"
          - "rgw/crypt"
          - "rgw/lifecycle"
    steps:
      - name: Run Teuthology Via Orchestrator Action
        uses: StorageTeam/test-ceph-action/composite-actions/orchestrate-teuthology-suite@main
        with:
          rt-username: ${{ secrets.RT_USERNAME }}
          rt-token: ${{ secrets.RT_ACCESS_TOKEN }}
          rt-custom-ca-cert: ${{ secrets.RT_CUSTOM_CA_CERT }}
          checkout-token: ${{ secrets.CHECKOUT_TOKEN }}
          # Test the image/packages just built & published by this workflow, not an operator-supplied one.
          ceph-image-ref: ${{ needs.build-ceph-docker-images.outputs.docker_image }}
          suite: ${{ matrix.suite }}
          filter-out-extra: "barbican"
          teuthology-repo: ${{ vars.TEUTHOLOGY_REPO || 'StorageTeam/teuthology' }}
          teuthology-branch: ${{ vars.TEUTHOLOGY_BRANCH || 'chsmith/fix-builds' }}
          devstack-repo: ${{ vars.DEVSTACK_REPO || 'StorageTeam/ceph-devstack' }}
          devstack-branch: ${{ vars.DEVSTACK_BRANCH || 'mheler-upstream' }}
          ceph-package-repo-base-url: ${{ vars.CEPH_PACKAGE_REPO_BASE_URL || 'https://artifactory.linode.com/artifactory' }}
          ceph-package-repo-path: ${{ vars.DEBIAN_REPO }}
          ceph-package-repo-component: ${{ needs.build-ceph-debians.outputs.ceph_package_repo_component }}
          ceph-package-repo-trusted: ${{ vars.CEPH_PACKAGE_REPO_TRUSTED || 'true' }}
          ceph-package-repo-ca-cert-url: ${{ vars.CEPH_PACKAGE_REPO_CA_CERT_URL || 'https://us-east-1.linodeobjects.com/linode-internal-ca/cacert-2019.pem' }}
          ceph-package-version: ${{ needs.build-ceph-docker-images.outputs.ceph_deb_version }}
          upload-artifacts: 'false'
          distro-version: "22.04"